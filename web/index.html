<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<title>Live Camera</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080a0d;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #70e4c1;outline-offset:3px}[hidden]{display:none!important}
#player{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#080a0d}video{display:block;width:100%;height:100%;object-fit:contain}#player:fullscreen{height:100%;width:100%}.overlay{transition:opacity .25s,transform .25s}.top{position:absolute;inset:0 0 auto;padding:calc(18px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 50px max(20px,env(safe-area-inset-left));background:linear-gradient(#0009,transparent);pointer-events:none}#status{font-size:12px;font-weight:500;letter-spacing:.03em;display:inline-block;max-width:100%;text-shadow:0 1px 6px #000}
.bottom{position:absolute;inset:auto 0 0;padding:46px max(24px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:linear-gradient(transparent,#000b 55%,#000d)}.controls{max-width:1200px;margin:auto}.scrubber{position:relative;height:44px;display:flex;align-items:center}#timeline{--progress:100%;appearance:none;-webkit-appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:none}#timeline::-webkit-slider-runnable-track{height:3px;border-radius:8px;background:linear-gradient(to right,#70e4c1 var(--progress),#ffffff40 var(--progress))}#timeline::-moz-range-track{height:3px;border-radius:8px;background:#ffffff40}#timeline::-moz-range-progress{height:3px;background:#70e4c1}#timeline::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 0 0 4px #ffffff15}#timeline::-moz-range-thumb{border:0;width:16px;height:16px;border-radius:50%;background:#fff}#timeline:disabled{opacity:.3;cursor:wait}.row{display:flex;align-items:center;gap:8px;min-height:44px}.spacer{flex:1}.icon,.time,.live{height:44px;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.icon{width:44px;flex-shrink:0}.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.time{padding:0 10px;font-size:13px;font-variant-numeric:tabular-nums}.live{padding:0 14px;font-size:13px;background:#ffffff0d}.dot{width:6px;height:6px;border-radius:50%;background:#a1a1aa}#player[data-mode=live] .dot{background:#70e4c1;box-shadow:0 0 9px #70e4c160}#start{font-size:11px;color:#ffffff70;margin-right:8px;font-variant-numeric:tabular-nums}#retry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#182522e8;border:1px solid #70e4c160;border-radius:24px;padding:14px 24px;backdrop-filter:blur(12px)}#player.quiet .overlay{opacity:0;pointer-events:none;transform:translateY(5px)}#player.quiet{cursor:none}dialog{width:min(360px,calc(100% - 32px));padding:24px;border:1px solid #ffffff18;border-radius:20px;background:#151a20;box-shadow:0 24px 100px #0009}dialog::backdrop{background:#0008;backdrop-filter:blur(6px)}dialog h2{margin:0 0 18px;font-size:17px}dialog label{display:block;font-size:13px;color:#b0bac6}dialog input{width:100%;min-width:0;padding:12px;margin:10px 0;background:#080a0d;border:1px solid #ffffff24;border-radius:10px;color:#fff}dialog p{font-size:12px;color:#b0bac6;line-height:1.6}dialog .row{justify-content:flex-end}dialog button{padding:12px 18px;border-radius:10px;background:#ffffff0c}dialog button[type=submit]{background:#70e4c1;color:#09241c}#seek-error{color:#ffb4a6}
@media(hover:hover){button:hover{background:#ffffff18}}@media(max-width:600px){.bottom{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:calc(8px + env(safe-area-inset-bottom))}.top{padding-left:18px}.row{gap:2px}#start{display:none}.time{font-size:12px;padding:0 6px}.live{padding:0 10px}#timeline::-webkit-slider-thumb{width:20px;height:20px;margin-top:-8.5px}#timeline::-moz-range-thumb{width:20px;height:20px}}@media(prefers-reduced-motion:reduce){.overlay{transition:none}}
/* Preview overlays take no layout space; keep the native range accessible. */
.scrubber{--thumb-size:16px;--track-size:3px;--preview-x:50%}.scrubber.previewing{--track-size:5px}.scrubber.scrubbing{--track-size:6px}#timeline::-webkit-slider-runnable-track{height:var(--track-size);transition:height .15s}#timeline::-moz-range-track,#timeline::-moz-range-progress{height:var(--track-size);transition:height .15s}#timeline::-webkit-slider-thumb{margin-top:calc((var(--track-size) - var(--thumb-size))/2);transition:box-shadow .15s,transform .15s}.scrubber.scrubbing #timeline::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 0 8px #70e4c126}.scrubber.scrubbing #timeline::-moz-range-thumb{transform:scale(1.15);box-shadow:0 0 0 8px #70e4c126}.seek-preview{position:absolute;bottom:48px;left:0;z-index:2;width:max-content;max-width:100%;padding:10px 14px;border:1px solid #ffffff22;border-radius:12px;background:#111820ed;box-shadow:0 8px 32px #0006;backdrop-filter:blur(16px);pointer-events:none;text-align:center;opacity:0;transform:translateY(5px);transition:opacity .12s,transform .12s;font-variant-numeric:tabular-nums}.previewing .seek-preview{opacity:1;transform:translateY(0)}.seek-preview strong{display:block;font-size:13px;font-weight:550;white-space:nowrap}.seek-preview small{display:block;margin-top:4px;font-size:11px;color:#a6b5c4}.seek-marker{position:absolute;pointer-events:none;left:var(--preview-x);top:15px;height:14px;width:2px;background:#fff9;border-radius:2px;opacity:0}.previewing:not(.scrubbing) .seek-marker{opacity:1}.scrubber.at-live .seek-preview strong{color:#70e4c1}.scrubber.touch-scrub .seek-preview{bottom:78px}.scrubber.scrubbing .seek-preview{border-color:#70e4c155}#timeline{user-select:none;-webkit-user-select:none}@media(max-width:600px){.scrubber{--thumb-size:20px}.seek-preview{padding:10px 12px}}@media(prefers-reduced-motion:reduce){.seek-preview,#timeline::-webkit-slider-runnable-track,#timeline::-webkit-slider-thumb{transition:none}}
.top:has(#status:empty){display:none}
/* Manual recording controls stay compact; the library opens only on request. */
button:disabled{cursor:default;opacity:.45}#record .record-dot{display:block;width:13px;height:13px;border:2px solid #f6a4aa;border-radius:50%;transition:background .2s,border-radius .2s}#record[aria-checked=true] .record-dot{background:#ff6374;border-color:#ff6374;border-radius:3px}#recording-status{position:absolute;top:calc(18px + env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));font-size:12px;color:#ff8290;background:#160a0bc9;border:1px solid #ff829030;border-radius:8px;padding:5px 9px;pointer-events:none}#player[data-mode=live] #choose-time,#player[data-mode=live] #start{display:none}#recordings-dialog{width:min(600px,calc(100% - 24px));max-height:85vh;max-height:85dvh;overflow:auto}#recordings-dialog header{display:flex;justify-content:space-between;align-items:center}#recordings-dialog h2{margin:0}#recordings-list{list-style:none;margin:0;padding:0}.recording-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid #ffffff12;padding:8px 0;gap:4px 8px}.recording-entry{text-align:left;background:transparent;padding:12px 8px;min-height:60px;min-width:0}.recording-entry strong{display:block;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}.recording-entry span{display:block;font-size:12px;margin-top:6px;color:#a6b5c4}.recording-error{grid-column:1;grid-row:2;color:#ffb4a6;font-size:12px;padding:0 8px 8px}.delete-recording{grid-column:2;grid-row:1;color:#d8a8ab;font-size:12px!important;padding:12px!important}#recordings-error{color:#ffb4a6}.empty{padding:30px 8px;text-align:center}#player[data-mode=history] .time{font-size:12px}@media(max-width:600px){#player[data-mode=history] .row{flex-wrap:wrap}#player[data-mode=history] #choose-time{order:-1;flex-basis:100%;height:28px;justify-content:flex-start}#player[data-mode=history] .bottom{padding-top:32px}.recording-entry strong{font-size:12px}}
</style>
</head>
<body>
<main id="player" data-mode="live" aria-label="摄像头播放器">
<video id="video" autoplay muted playsinline aria-label="摄像头画面"></video>
<div class="top overlay"><span id="status" role="status">正在连接…</span></div>
<span id="recording-status" hidden aria-live="polite"></span>
<div class="bottom overlay"><div class="controls">
<div class="scrubber" hidden>
<div class="seek-preview" aria-hidden="true"><strong id="preview-time"></strong><small id="preview-offset"></small></div>
<span class="seek-marker" aria-hidden="true"></span>
<input id="timeline" type="range" min="0" max="1" step="1" value="1" disabled aria-label="录像进度条">
</div>
<div class="row">
<button class="icon" id="pause" aria-label="暂停" title="播放 / 暂停"><svg viewBox="0 0 24 24"><path id="pause-symbol" d="M8 5v14M16 5v14"/></svg></button>
<button class="time" id="choose-time" title="选择回溯时间" aria-label="选择精确回溯时间"><span id="selected">实时</span></button>
<span class="spacer"></span><span id="start"></span>
<button class="icon" id="record" role="switch" aria-checked="false" aria-label="开始录像" title="开始录像"><span class="record-dot"></span></button>
<button class="icon" id="open-recordings" aria-label="录像列表" title="录像列表"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 9l6 3-6 3z"/></svg></button>
<button class="live" id="go-live" title="回到实时直播"><span class="dot"></span>直播</button>
<button class="icon" id="fullscreen" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
</div></div></div>
<button id="retry" hidden>重新连接 / 播放</button>
<dialog id="recordings-dialog" aria-labelledby="recordings-title"><header><h2 id="recordings-title">录像</h2><button type="button" id="close-recordings" aria-label="关闭录像列表">关闭</button></header><p id="recordings-note"></p><p id="recordings-error" role="alert"></p><ul id="recordings-list"></ul></dialog>
<dialog id="time-dialog"><form id="time-form"><h2>回看</h2><label for="seek-time">选择时间</label><input id="seek-time" type="datetime-local" step="1" required><p id="available"></p><p id="seek-error" role="alert"></p><div class="row"><button type="button" id="cancel-time">取消</button><button type="submit">前往</button></div></form></dialog>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
